name: Build iPad app

on:
  push:
    branches: ["main", "claude/**"]
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned .ipa
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Build (Release, device, unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/TeacherPrompter.xcodeproj \
            -scheme TeacherPrompter \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/TeacherPrompter.app Payload/
          zip -qry TeacherPrompter-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: TeacherPrompter-ipa
          path: TeacherPrompter-unsigned.ipa

  test:
    name: Unit tests (iPad simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          ipads = [d for runtime, ds in devices.items() if "iOS" in runtime for d in ds if "iPad" in d["name"]]
          print(ipads[-1]["udid"])')
          echo "Simulator: $UDID"
          xcodebuild \
            -project ios/TeacherPrompter.xcodeproj \
            -scheme TeacherPrompter \
            -destination "id=$UDID" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            test
